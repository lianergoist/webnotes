<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico">
  <title>WebNotes</title>
  <link rel="stylesheet" href="style.css?v=51cb254e">
</head>
<body data-view="list">
  <div class="app">
    <div id="banner" class="banner" role="status" hidden>
      <span id="banner-text" class="banner-text"></span>
      <button id="banner-action" class="btn small" type="button" hidden></button>
      <button id="banner-close" class="btn small ghost" type="button" data-i18n="close">Luk</button>
    </div>

    <aside class="sidebar">
      <header class="bar">
        <h1 data-i18n="appTitle">WebNotes</h1>
        <button id="btn-new" class="btn primary" type="button" data-i18n="newNote">Ny note</button>
      </header>
      <div class="tools">
        <input id="search" type="search" placeholder="Søg i noter" aria-label="Søg i noter" autocomplete="off"
               data-i18n-placeholder="search" data-i18n-aria-label="search">
        <select id="collection" aria-label="Samling" data-i18n-aria-label="collectionLabel" hidden></select>
      </div>
      <p id="empty" class="empty" hidden></p>
      <nav id="list" class="list" aria-label="WebNotes" data-i18n-aria-label="appTitle"></nav>
      <footer class="foot">
        <select id="lang" class="lang" aria-label="Sprog / Language" data-i18n-aria-label="langLabel">
          <option value="da">Dansk</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </footer>
    </aside>

    <main class="editor">
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Værktøjer til noten" data-i18n-aria-label="toolbarLabel">
        <button id="btn-back" class="tb back" type="button" data-i18n="back">WebNotes</button>
        <div class="seg" role="group">
          <button id="mode-edit" class="tb seg-btn" type="button" aria-pressed="true" data-i18n="modeEdit">Skriv</button>
          <button id="mode-preview" class="tb seg-btn" type="button" aria-pressed="false" data-i18n="modePreview">Vis</button>
        </div>
        <div class="fmt" role="group">
          <button class="tb icon" type="button" data-fmt="bold" title="Fed" aria-label="Fed" data-i18n-title="fmtBold" data-i18n-aria-label="fmtBold"><b>B</b></button>
          <button class="tb icon" type="button" data-fmt="italic" title="Kursiv" aria-label="Kursiv" data-i18n-title="fmtItalic" data-i18n-aria-label="fmtItalic"><i>I</i></button>
          <button class="tb icon" type="button" data-fmt="heading" title="Overskrift" aria-label="Overskrift" data-i18n-title="fmtHeading" data-i18n-aria-label="fmtHeading">H</button>
          <button class="tb icon" type="button" data-fmt="link" title="Link" aria-label="Link" data-i18n-title="fmtLink" data-i18n-aria-label="fmtLink">&#128279;&#xFE0E;</button>
          <button class="tb icon" type="button" data-fmt="bullets" title="Punktliste" aria-label="Punktliste" data-i18n-title="fmtBullets" data-i18n-aria-label="fmtBullets">&bull;</button>
          <button class="tb icon" type="button" data-fmt="numbers" title="Nummereret liste" aria-label="Nummereret liste" data-i18n-title="fmtNumbers" data-i18n-aria-label="fmtNumbers">1.</button>
          <button class="tb icon" type="button" data-fmt="todo" title="Opgaveliste" aria-label="Opgaveliste" data-i18n-title="fmtTodo" data-i18n-aria-label="fmtTodo">&#9745;</button>
          <button class="tb icon" type="button" data-fmt="outdent" title="Ryk tilbage" aria-label="Ryk tilbage" data-i18n-title="fmtOutdent" data-i18n-aria-label="fmtOutdent">&#8676;</button>
          <button class="tb icon" type="button" data-fmt="indent" title="Ryk ind" aria-label="Ryk ind" data-i18n-title="fmtIndent" data-i18n-aria-label="fmtIndent">&#8677;</button>
          <button class="tb icon" type="button" data-fmt="quote" title="Citat" aria-label="Citat" data-i18n-title="fmtQuote" data-i18n-aria-label="fmtQuote">&rdquo;</button>
          <button class="tb icon" type="button" data-fmt="code" title="Kode" aria-label="Kode" data-i18n-title="fmtCode" data-i18n-aria-label="fmtCode">&lt;/&gt;</button>
        </div>
        <div class="menu-wrap">
          <button id="btn-menu" class="tb icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"
                  title="Mere" aria-label="Mere" data-i18n-title="menuLabel" data-i18n-aria-label="menuLabel">&#8943;</button>
          <div id="menu" class="menu" role="menu" hidden>
            <button id="btn-import" class="menu-item" type="button" role="menuitem" title="Importér .md- eller .txt-filer som nye noter" data-i18n="importFiles" data-i18n-title="importTitle">Importér</button>
            <button id="btn-export-md" class="menu-item" type="button" role="menuitem" data-i18n="exportMd" disabled>Eksportér .md</button>
            <button id="btn-export-txt" class="menu-item" type="button" role="menuitem" data-i18n="exportTxt" disabled>Eksportér .txt</button>
            <hr class="menu-sep">
            <button id="btn-delete" class="menu-item danger" type="button" role="menuitem" data-i18n="deleteNote" disabled>Slet note</button>
            <hr class="menu-sep">
            <button id="btn-logout" class="menu-item" type="button" role="menuitem" data-i18n="logout">Log ud</button>
            <input id="file-import" type="file" multiple hidden accept=".md,.markdown,.txt,text/plain,text/markdown">
          </div>
        </div>
      </div>
      <div class="sheet">
        <div class="statusline">
          <span id="status" class="status" role="status" aria-live="polite"></span>
          <span id="meta" class="meta" hidden></span>
        </div>
        <input id="title" class="title-input" type="text" placeholder="Titel" aria-label="Titel" autocomplete="off"
               data-i18n-placeholder="titleField" data-i18n-aria-label="titleField">
        <input id="tags" class="tags-input" type="text" placeholder="Tilføj tags, adskilt med komma" aria-label="Tags" autocomplete="off"
               data-i18n-placeholder="tagsPlaceholder" data-i18n-aria-label="tagsLabel">
        <textarea id="body" class="body-input" placeholder="Skriv her" aria-label="Notetekst"
                  data-i18n-placeholder="bodyPlaceholder" data-i18n-aria-label="bodyLabel"></textarea>
        <div id="preview" class="preview" tabindex="0" hidden></div>
      </div>
    </main>
  </div>

  <script src="ical.js?v=185e5fbe"></script>
  <script src="dav.js?v=ba32b105"></script>
  <script src="i18n.js?v=4d08c6e7"></script>
  <script src="md.js?v=a4b9c6e8"></script>
  <script src="app.js?v=4ea0dee7"></script>
</body>
</html>
